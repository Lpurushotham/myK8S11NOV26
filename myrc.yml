apiVersion: v1
kind: ReplicationControler
metadata: 
   name: myrc
spec:
  replicas: 3
  selector: 
    app: myapp
  template:
   metadata:
    labels:
     app: myapp
  spec:
     containers:
     - name: mycontainer
       image: maha4iac/mahalogin:1
       ports:
       - containerPort: 8080        